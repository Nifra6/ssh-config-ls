[project]
name = "ssh-config-ls"
version = "0.10.2"
description = "A Language Server for OpenSSH configuration files, with a CLI formatter."
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicolas MAIGNAN", email = "nicolas.maignan@proton.me" }]
keywords = [
  "formatter",
  "language-server",
  "lsp",
  "openssh",
  "ssh",
]
dependencies = [
  "pygls>=2.1.1",
  "typer>=0.26.7",
]

[project.urls]
Changelog = "https://gitlab.com/nifra/ssh-config-ls/-/blob/main/CHANGELOG.md"
Documentation = "https://sshls.nicolasmaignan.fr"
Repository = "https://gitlab.com/nifra/ssh-config-ls"

[project.scripts]
sshls = "ssh_config_ls.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.15.14",
  "ty>=0.0.40",
  "zensical>=0.0.54",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.pytest]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY001",  # I do not care about copyrights, LICENSE files exists.
  "FIX",  # Editors should highlight those, but dev notes mustn't block commit
  "TD",  # TODO/FIXME tracking overkill for solo project
  "COM812",  # Ruff formats trailing commas, so redundant
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.tombi.format.rules]
line-width = 88
