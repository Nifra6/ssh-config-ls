stages:
  - lint
  - deploy

.base_ruff:
  stage: lint
  interruptible: true
  image:
    name: ghcr.io/astral-sh/ruff:alpine
  before_script:
    - ruff --version

ruff-check:
  extends: .base_ruff
  script:
    - ruff check --output-format=gitlab --output-file=code-quality-report.json
  artifacts:
    reports:
      codequality: code-quality-report.json

ruff-format:
  extends: .base_ruff
  script:
    - ruff format --diff

pages:
  stage: deploy
  image: python:latest
  script:
    - pip install zensical
    - zensical build --clean 
  pages:
    publish: site 
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

publish:
  stage: deploy
  image: ghcr.io/astral-sh/uv:alpine
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - uv build
    - uv publish
