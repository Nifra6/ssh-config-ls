stages:
  - lint
  - deploy

.base_ruff:
  stage: lint
  interruptible: true
  image:
    name: ghcr.io/astral-sh/ruff:alpine
  before_script:
    - ruff --version

ruff-check:
  extends: .base_ruff
  script:
    - ruff check --output-format=gitlab --output-file=code-quality-report.json
  artifacts:
    reports:
      codequality: code-quality-report.json

ruff-format:
  extends: .base_ruff
  script:
    - ruff format --diff

pages:
  stage: deploy
  image: python:3.14-slim
  publish: public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  before_script:
    - pip install . pdoc
  script:
    - pdoc -o public -d google --no-include-undocumented --logo https://gitlab.com/uploads/-/system/project/avatar/82167111/logo.png --logo-link https://gitlab.com/nifra/ssh-config-ls ssh_config_ls


publish:
  stage: deploy
  image: ghcr.io/astral-sh/uv:alpine
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - uv build
    - uv publish
