[project]
site_name = "sshls"
site_url = "https://sshls.nicolasmaignan.fr"
site_description = "A Language Server for OpenSSH configuration files, with a CLI formatter."
site_author = "Nicolas Maignan"
copyright = "Copyright &copy; 2026 Nicolas Maignan"

repo_url = "https://gitlab.com/nifra/ssh-config-ls"
repo_name = "nifra/ssh-config-ls"

nav = [
  { "Home" = "index.md" },
  { "Get started" = ["installation.md", "editors.md"] },
  { "Usage" = ["configuration.md", "cli.md"] },
  "changelog.md"
]

[project.theme]
language = "en"
logo = "https://gitlab.com/uploads/-/system/project/avatar/82167111/logo.png"
favicon = "https://gitlab.com/uploads/-/system/project/avatar/82167111/logo.png"
features = [
  # "announce.dismiss",
  # "content.code.annotate",
  "content.code.copy",  # Enable copy button in code cells
  # "content.code.select",
  # "content.footnote.tooltips",
  "content.tabs.link",  # Synchronize selected label across content tabs
  # "content.tooltips",
  "navigation.footer",  # Arrows for previous/next pages at the footer
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.path",
  "navigation.sections",  # Sections are expanded and in bold when the browser is wide enough
  "navigation.top",  # Back to top button
  "navigation.tracking",  # URL synchronized with sections and cie within pages
  "search.highlight",
]

[project.theme.icon]
repo = "fontawesome/brands/gitlab"

[project.theme.font]
code = "Jetbrains Mono"

# --- Light / dark toggle

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# --- Social icons

[[project.extra.social]]
icon = "simple/gitlab"
link = "https://gitlab.com/nifra/ssh-config-ls"

[[project.extra.social]]
icon = "simple/pypi"
link = "https://pypi.org/project/ssh-config-ls/"

[[project.extra.social]]
icon = "simple/bluesky"
link = "https://bsky.app/profile/nicolasmaignan.fr"

[[project.extra.social]]
icon = "lucide/globe"
link = "https://nicolasmaignan.fr"

# --- Zenzical extensions

[project.markdown_extensions]
# abbr = {}
admonition = {}
# attr_list = {}
# def_list = {}
# footnotes = {}
md_in_html = {}
toc = { permalink = true }
pymdownx.arithmatex = { generic = true }
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji = { emoji_generator = "zensical.extensions.emoji.to_svg", emoji_index = "zensical.extensions.emoji.twemoji" }
pymdownx.highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets = {}
pymdownx.superfences = { custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
] }
pymdownx.tabbed = { alternate_style = true, combine_header_slug = true }
pymdownx.tasklist = { custom_checkbox = true }
pymdownx.tilde = {}
